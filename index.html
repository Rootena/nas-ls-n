<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bana Kırgın mısın? 🥺💔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.4);
            max-width: 600px;
            width: 90%;
            position: relative;
            animation: float 6s ease-in-out infinite;
            border: 3px solid #ffb6c1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #ff6b9d;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.3);
        }

        .gif-container {
            width: 100%;
            height: 300px;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            background: #fff0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffc0cb;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #evetBtn {
            background: linear-gradient(45deg, #ff6b9d, #ff8fab);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        #evetBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6);
        }

        #hayirBtn {
            background: linear-gradient(45deg, #a8a8a8, #d3d3d3);
            color: white;
            box-shadow: 0 4px 15px rgba(169, 169, 169, 0.4);
        }

        #hayirBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(169, 169, 169, 0.6);
        }

        .counter {
            margin-top: 20px;
            font-size: 1.1em;
            color: #ff6b9d;
            font-weight: bold;
            min-height: 30px;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: fall linear forwards;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .final-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .final-message img {
            max-width: 80%;
            max-height: 60vh;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 255, 255, 0.3);
            border: 3px solid white;
        }

        .final-message h2 {
            color: white;
            font-size: 3em;
            margin-top: 30px;
            text-align: center;
            animation: pulse 2s infinite;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2em;
            cursor: pointer;
            background: none;
            border: none;
        }

        .emoji {
            font-size: 2em;
            margin: 0 10px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            button { padding: 12px 30px; font-size: 1em; }
        }

        /* Kırgın mesaj stili */
        .kargin-mesaj {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            border: 2px solid #ffb6c1;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kargin-mesaj p {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 15px;
            font-style: italic;
        }

        .alt-evet-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81) !important;
            padding: 12px 35px !important;
            font-size: 1.1em !important;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <h1>Bana kırgın mısın? <span class="emoji">🥺</span></h1>
        
        <div class="gif-container" id="gifContainer">
            <img id="mainGif" src="https://media.tenor.com/BxibqUT9-I0AAAAM/dudu-flower.gif" alt="Cute bear">
        </div>
        
        <div class="buttons" id="buttonContainer">
            <button id="evetBtn" onclick="evetTikla()">Evet</button>
            <button id="hayirBtn" onclick="hayirTikla()">Hayır</button>
        </div>
        
        <div class="counter" id="counter"></div>
        
        <!-- Kırgın mesaj alanı (başta gizli) -->
        <div id="karginAlani" style="display: none;">
            <div class="kargin-mesaj">
                <p id="karginYazi">Kırgınsın bence...</p>
                <button class="alt-evet-btn" onclick="evetTikla()">Evet</button>
            </div>
        </div>
    </div>

    <div class="final-message" id="finalMessage">
        <button class="close-btn" onclick="kapat()">×</button>
        <img id="finalGif" src="" alt="Final gif">
        <h2 id="finalYazi">Seni Çok Seviyorum! 💖</h2>
    </div>

    <script>
        let evetTiklamaSayisi = 0;
        let hayirTiklamaSayisi = 0;
        
        // Mutlu/Güzel GIF'ler - Evet için (kırgın değilsin = mutlu)
        const mutluGifs = [
            "https://media.tenor.com/GX36qlwcJWsAAAAM/cute-love.gif",
            "https://media.tenor.com/2iI3N3Z2z1wAAAAM/love-heart.gif",
            "https://media.tenor.com/4t1Q4z5tQZoAAAAM/love-you.gif",
            "https://media.tenor.com/dyM5bOJ8QYgAAAAM/happy-cute.gif",
            "https://media.tenor.com/5tFzKj-4w7QAAAAM/love-kiss.gif"
        ];

        // Üzgün/Kırgın GIF'ler - Hayır için (kırgınsın = üzgün)
        const karginGifs = [
            "https://media.tenor.com/kbsXEDqseL8AAAAM/i-will-not-talk-to-you.gif",
            "https://media.tenor.com/UjL9HRZotq0AAAAM/angry-mad.gif",
            "https://media.tenor.com/zkvh5c3BkKoAAAAM/cute-adorable.gif",
            "https://media.tenor.com/7Q9KJ2zK1QwAAAAM/sad-crying.gif",
            "https://media.tenor.com/6C8jJ5iFz1wAAAAM/cry-sad.gif"
        ];

        // Mutlu mesajlar - Evet için
        const mutluMesajlar = [
            "Seni seviyorum! 💕",
            "Çok mutlu oldum! 😊",
            "Harika! 🎉",
            "Sana bayılıyorum! 💖",
            "Çok tatlısın! 🥰",
            "Kalbimi ısıttın! 💝",
            "Aşık oldum sana! 💘",
            "Sen benim her şeyimsin! 🌟"
        ];

        // Kırgın mesajlar - Hayır için
        const karginMesajlar = [
            "Kırgınsın bence... 😔",
            "Üzgünsün değil mi? 🥺",
            "Kırıldın galiba... 💔",
            "Barışalım mı? 🌸",
            "Özür dilerim! 🙏",
            "Seni incittiysem affet! 😢",
            "Küsme bana lütfen! 💕",
            "Seni üzdüysem çok üzgünüm! 😭"
        ];

        // Kalp yağmuru efekti
        function kalpYagmuru() {
            const heartsContainer = document.getElementById('hearts');
            const emojis = ['💖', '💕', '💗', '💓', '💝', '🌸', '🎀', '💐'];
            
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 5000);
                }, i * 80);
            }
        }

        // Evet butonuna tıklandığında (Kırgın değilsin = Mutlu)
        function evetTikla() {
            evetTiklamaSayisi++;
            
            // Kırgın alanını gizle (varsa)
            document.getElementById('karginAlani').style.display = 'none';
            
            // Evet butonunu büyüt
            const evetBtn = document.getElementById('evetBtn');
            if (evetBtn) {
                evetBtn.style.transform = `scale(${1 + (evetTiklamaSayisi * 0.15)})`;
            }
            
            // Mutlu GIF değiştir
            const gifIndex = Math.min(evetTiklamaSayisi - 1, mutluGifs.length - 1);
            document.getElementById('mainGif').src = mutluGifs[gifIndex];
            
            // Mutlu mesaj göster
            const mesaj = mutluMesajlar[Math.min(evetTiklamaSayisi - 1, mutluMesajlar.length - 1)];
            document.getElementById('counter').innerHTML = `${mesaj} ${'💖'.repeat(evetTiklamaSayisi)}`;
            
            // Kalp efekti
            kalpYagmuru();
            
            // 5. tıklamada mutlu final
            if (evetTiklamaSayisi >= 5) {
                setTimeout(() => {
                    document.getElementById('finalGif').src = "https://media.tenor.com/2iI3N3Z2z1wAAAAM/love-heart.gif";
                    document.getElementById('finalYazi').innerHTML = "Seni Çok Seviyorum! 💖";
                    document.getElementById('finalMessage').style.display = 'flex';
                }, 500);
            }
        }

        // Hayır butonuna tıklandığında (Kırgınsın = Üzgün)
        function hayirTikla() {
            hayirTiklamaSayisi++;
            
            // Üzgün GIF göster
            const gifIndex = Math.min(hayirTiklamaSayisi - 1, karginGifs.length - 1);
            document.getElementById('mainGif').src = karginGifs[gifIndex];
            
            // Ana butonları gizle
            document.getElementById('evetBtn').style.display = 'none';
            document.getElementById('hayirBtn').style.display = 'none';
            
            // Kırgın mesaj alanını göster
            const karginAlani = document.getElementById('karginAlani');
            karginAlani.style.display = 'block';
            
            // Rastgele kırgın mesaj seç
            const mesaj = karginMesajlar[Math.floor(Math.random() * karginMesajlar.length)];
            document.getElementById('karginYazi').innerHTML = mesaj;
            
            // Sayaç güncelle
            document.getElementById('counter').innerHTML = `Kırgınsın... ${'💔'.repeat(hayirTiklamaSayisi)} Ama ben seni seviyorum!`;
            
            // 3. tıklamada üzgün final
            if (hayirTiklamaSayisi >= 3) {
                setTimeout(() => {
                    document.getElementById('finalGif').src = "https://media.tenor.com/7Q9KJ2zK1QwAAAAM/sad-crying.gif";
                    document.getElementById('finalYazi').innerHTML = "Özür Dilerim! 🥺💔";
                    document.getElementById('finalMessage').style.display = 'flex';
                }, 800);
            }
        }

        // Final mesajı kapat
        function kapat() {
            document.getElementById('finalMessage').style.display = 'none';
        }

        // Arada kalp yağmuru
        setInterval(() => {
            if (Math.random() > 0.8) kalpYagmuru();
        }, 4000);
    </script>
</body>
</html>
